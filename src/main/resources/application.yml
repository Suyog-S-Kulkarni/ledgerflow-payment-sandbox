spring:
  application:
    name: ledgerflow-payment-sandbox

  datasource:
    url: "jdbc:mysql://localhost:3306/ledgerflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
    username: ledgerflow_app
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ledgerflow

app:
  security:
    audience: ledgerflow-api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never