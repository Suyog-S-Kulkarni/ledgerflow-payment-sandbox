services:
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: local-payments-only

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - payments-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  payments-data: